<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- A made-up album cover: two riveted steel loudspeakers facing each other in a ploughed field at dusk. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16244D"/>
      <stop offset=".38" stop-color="#3F64A3"/>
      <stop offset=".54" stop-color="#8FA9D0"/>
      <stop offset=".6" stop-color="#E7B9A0"/>
      <stop offset=".64" stop-color="#F6A877"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2621"/>
      <stop offset=".3" stop-color="#4A382B"/>
      <stop offset="1" stop-color="#6B4E37"/>
    </linearGradient>
    <linearGradient id="steelFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA1AB"/>
      <stop offset=".35" stop-color="#E4E7EB"/>
      <stop offset=".6" stop-color="#B9BFC7"/>
      <stop offset="1" stop-color="#7E858F"/>
    </linearGradient>
    <linearGradient id="steelSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4B5058"/>
      <stop offset="1" stop-color="#868D97"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="cone" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#5C6068"/>
      <stop offset=".6" stop-color="#2A2C31"/>
      <stop offset="1" stop-color="#141518"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFE3A3"/>
      <stop offset=".3" stop-color="#FFB24D" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="1000"/></clipPath>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="wisp" x="-30%" y="-80%" width="160%" height="260%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .05" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softer" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/>
    </filter>
    <filter id="soil">
      <feTurbulence type="fractalNoise" baseFrequency=".02 .35" numOctaves="3" seed="4"/>
      <feColorMatrix values="0 0 0 0 .12  0 0 0 0 .08  0 0 0 0 .05  0 0 0 .9 -.25"/>
    </filter>

    <!-- One speaker, standing at the left, its face turned to the centre. -->
    <g id="speaker">
      <path d="M170 884 L300 902 L40 960 L-60 930 Z" fill="#000" opacity=".4" filter="url(#softer)"/>
      <path d="M170 352 L300 332 L300 902 L170 884 Z" fill="url(#steelSide)"/>
      <path d="M300 332 L476 362 L476 866 L300 902 Z" fill="url(#steelFront)"/>
      <path d="M300 332 L476 362 L476 866 L300 902 Z" fill="url(#shade)"/>
      <path d="M170 352 L300 332 L476 362" fill="none" stroke="#F3F5F7" stroke-width="2.5" opacity=".8"/>
      <path d="M300 332 L300 902" stroke="#F3F5F7" stroke-width="1.5" opacity=".5"/>
      <!-- Panel seams. -->
      <path d="M300 560 L476 572 M300 760 L476 760 M235 342 L235 893" stroke="#6E747D" stroke-width="2" opacity=".7"/>
      <!-- Tweeter. -->
      <ellipse cx="392" cy="462" rx="44" ry="50" fill="#2B2E34"/>
      <ellipse cx="392" cy="462" rx="34" ry="39" fill="url(#cone)"/>
      <ellipse cx="392" cy="462" rx="19" ry="22" fill="#F1E6D2"/>
      <ellipse cx="392" cy="462" rx="12" ry="14" fill="#B5322B"/>
      <ellipse cx="392" cy="462" rx="4" ry="5" fill="#F1E6D2"/>
      <!-- Woofer. -->
      <ellipse cx="390" cy="680" rx="76" ry="88" fill="#2B2E34"/>
      <ellipse cx="390" cy="680" rx="66" ry="77" fill="#3B3F46"/>
      <ellipse cx="390" cy="680" rx="58" ry="68" fill="url(#cone)"/>
      <ellipse cx="390" cy="680" rx="40" ry="47" fill="none" stroke="#45494F" stroke-width="2"/>
      <ellipse cx="390" cy="680" rx="25" ry="29" fill="#F1E6D2"/>
      <ellipse cx="390" cy="680" rx="16" ry="19" fill="#B5322B"/>
      <ellipse cx="390" cy="680" rx="6" ry="7" fill="#F1E6D2"/>
      <!-- Rivets along the edges. -->
      <g fill="#5E646D">
        <circle cx="310" cy="352" r="3"/><circle cx="350" cy="359" r="3"/><circle cx="390" cy="366" r="3"/><circle cx="430" cy="373" r="3"/><circle cx="466" cy="379" r="3"/>
        <circle cx="310" cy="420" r="3"/><circle cx="310" cy="490" r="3"/><circle cx="310" cy="560" r="3"/><circle cx="310" cy="630" r="3"/><circle cx="310" cy="700" r="3"/><circle cx="310" cy="770" r="3"/><circle cx="310" cy="840" r="3"/>
        <circle cx="466" cy="440" r="3"/><circle cx="466" cy="510" r="3"/><circle cx="466" cy="580" r="3"/><circle cx="466" cy="650" r="3"/><circle cx="466" cy="720" r="3"/><circle cx="466" cy="790" r="3"/><circle cx="466" cy="850" r="3"/>
        <circle cx="340" cy="570" r="2.5"/><circle cx="380" cy="572" r="2.5"/><circle cx="420" cy="574" r="2.5"/><circle cx="440" cy="575" r="2.5"/>
        <circle cx="340" cy="760" r="2.5"/><circle cx="380" cy="760" r="2.5"/><circle cx="420" cy="760" r="2.5"/><circle cx="440" cy="760" r="2.5"/>
      </g>
      <g fill="#fff" opacity=".55">
        <circle cx="309" cy="351" r="1.2"/><circle cx="349" cy="358" r="1.2"/><circle cx="389" cy="365" r="1.2"/><circle cx="429" cy="372" r="1.2"/>
        <circle cx="309" cy="419" r="1.2"/><circle cx="309" cy="489" r="1.2"/><circle cx="309" cy="559" r="1.2"/><circle cx="309" cy="629" r="1.2"/><circle cx="309" cy="699" r="1.2"/>
      </g>
      <!-- Sky reflected on the top edge of the face. -->
      <path d="M300 760 L476 760 L476 866 L300 902 Z" fill="#F6A877" opacity=".12"/>
    </g>
  </defs>

  <rect width="1000" height="1000" fill="url(#sky)"/>
  <!-- Clouds. -->
  <g clip-path="url(#frame)">
  <g filter="url(#wisp)">
    <ellipse cx="180" cy="160" rx="260" ry="46" fill="#18305F" opacity=".7"/>
    <ellipse cx="760" cy="120" rx="300" ry="54" fill="#16295A" opacity=".75"/>
    <ellipse cx="620" cy="300" rx="240" ry="40" fill="#E9EEF6" opacity=".55"/>
    <ellipse cx="240" cy="330" rx="200" ry="34" fill="#DCE5F2" opacity=".5"/>
    <ellipse cx="860" cy="420" rx="180" ry="28" fill="#F3F5FA" opacity=".55"/>
    <ellipse cx="120" cy="470" rx="160" ry="24" fill="#E5ECF6" opacity=".45"/>
    <ellipse cx="520" cy="540" rx="300" ry="26" fill="#FFD9BE" opacity=".6"/>
    <ellipse cx="300" cy="590" rx="260" ry="14" fill="#FFC9A3" opacity=".5"/>
  </g>
  <!-- Horizon: a far tree line and a row of warm lights. -->
  <path d="M0 640 L0 628 Q30 618 60 627 Q90 612 120 626 L200 629 Q230 610 262 627 L420 631 Q450 622 470 630 L540 630 Q570 616 600 629 L760 627 Q790 606 820 626 Q850 615 880 628 L1000 624 L1000 640 Z" fill="#1C2130"/>
  <g>
    <circle cx="478" cy="633" r="22" fill="url(#glow)"/><circle cx="478" cy="633" r="3" fill="#FFF1C9"/>
    <circle cx="500" cy="633" r="22" fill="url(#glow)"/><circle cx="500" cy="633" r="3" fill="#FFF1C9"/>
    <circle cx="522" cy="633" r="22" fill="url(#glow)"/><circle cx="522" cy="633" r="3" fill="#FFF1C9"/>
  </g>
  <!-- The ploughed field, its furrows running to the lights. -->
  <rect y="638" width="1000" height="362" fill="url(#field)"/>
  <rect y="638" width="1000" height="362" filter="url(#soil)"/>
  <g stroke="#1A120C" opacity=".55" fill="none"><path d="M500 640 L-765 1000" stroke-width="2.4"/><path d="M500 640 L-721 1000" stroke-width="2.5"/><path d="M500 640 L-673 1000" stroke-width="1.3"/><path d="M500 640 L-644 1000" stroke-width="3.0"/><path d="M500 640 L-597 1000" stroke-width="1.7"/><path d="M500 640 L-540 1000" stroke-width="2.2"/><path d="M500 640 L-501 1000" stroke-width="2.2"/><path d="M500 640 L-463 1000" stroke-width="1.5"/><path d="M500 640 L-421 1000" stroke-width="3.1"/><path d="M500 640 L-382 1000" stroke-width="2.8"/><path d="M500 640 L-337 1000" stroke-width="1.3"/><path d="M500 640 L-293 1000" stroke-width="2.5"/><path d="M500 640 L-260 1000" stroke-width="1.3"/><path d="M500 640 L-207 1000" stroke-width="2.2"/><path d="M500 640 L-168 1000" stroke-width="3.1"/><path d="M500 640 L-126 1000" stroke-width="3.2"/><path d="M500 640 L-90 1000" stroke-width="3.0"/><path d="M500 640 L-47 1000" stroke-width="3.3"/><path d="M500 640 L4 1000" stroke-width="1.4"/><path d="M500 640 L31 1000" stroke-width="1.7"/><path d="M500 640 L89 1000" stroke-width="2.2"/><path d="M500 640 L125 1000" stroke-width="1.9"/><path d="M500 640 L164 1000" stroke-width="2.0"/><path d="M500 640 L203 1000" stroke-width="2.5"/><path d="M500 640 L250 1000" stroke-width="3.2"/><path d="M500 640 L294 1000" stroke-width="3.2"/><path d="M500 640 L339 1000" stroke-width="3.4"/><path d="M500 640 L377 1000" stroke-width="1.6"/><path d="M500 640 L423 1000" stroke-width="3.3"/><path d="M500 640 L466 1000" stroke-width="2.5"/><path d="M500 640 L504 1000" stroke-width="1.7"/><path d="M500 640 L549 1000" stroke-width="2.5"/><path d="M500 640 L580 1000" stroke-width="1.3"/><path d="M500 640 L633 1000" stroke-width="3.4"/><path d="M500 640 L660 1000" stroke-width="3.0"/><path d="M500 640 L708 1000" stroke-width="1.5"/><path d="M500 640 L748 1000" stroke-width="2.9"/><path d="M500 640 L801 1000" stroke-width="1.3"/><path d="M500 640 L838 1000" stroke-width="1.3"/><path d="M500 640 L882 1000" stroke-width="1.9"/><path d="M500 640 L928 1000" stroke-width="3.4"/><path d="M500 640 L962 1000" stroke-width="3.4"/><path d="M500 640 L1000 1000" stroke-width="1.4"/><path d="M500 640 L1048 1000" stroke-width="1.3"/><path d="M500 640 L1082 1000" stroke-width="2.1"/><path d="M500 640 L1132 1000" stroke-width="1.5"/><path d="M500 640 L1163 1000" stroke-width="3.1"/><path d="M500 640 L1210 1000" stroke-width="3.3"/><path d="M500 640 L1264 1000" stroke-width="2.0"/><path d="M500 640 L1297 1000" stroke-width="2.3"/><path d="M500 640 L1343 1000" stroke-width="2.5"/><path d="M500 640 L1383 1000" stroke-width="2.6"/><path d="M500 640 L1433 1000" stroke-width="2.3"/><path d="M500 640 L1465 1000" stroke-width="2.8"/><path d="M500 640 L1503 1000" stroke-width="1.9"/><path d="M500 640 L1560 1000" stroke-width="2.3"/><path d="M500 640 L1593 1000" stroke-width="1.2"/><path d="M500 640 L1632 1000" stroke-width="2.5"/><path d="M500 640 L1666 1000" stroke-width="2.6"/><path d="M500 640 L1721 1000" stroke-width="1.3"/><path d="M500 640 L1763 1000" stroke-width="2.2"/></g>
  <g stroke="#A4825F" stroke-width="1" opacity=".3" fill="none"><path d="M500 640 L-742 1000"/><path d="M500 640 L-705 1000"/><path d="M500 640 L-658 1000"/><path d="M500 640 L-616 1000"/><path d="M500 640 L-584 1000"/><path d="M500 640 L-541 1000"/><path d="M500 640 L-491 1000"/><path d="M500 640 L-445 1000"/><path d="M500 640 L-412 1000"/><path d="M500 640 L-368 1000"/><path d="M500 640 L-324 1000"/><path d="M500 640 L-286 1000"/><path d="M500 640 L-243 1000"/><path d="M500 640 L-202 1000"/><path d="M500 640 L-159 1000"/><path d="M500 640 L-114 1000"/><path d="M500 640 L-76 1000"/><path d="M500 640 L-33 1000"/><path d="M500 640 L15 1000"/><path d="M500 640 L46 1000"/><path d="M500 640 L96 1000"/><path d="M500 640 L140 1000"/><path d="M500 640 L176 1000"/><path d="M500 640 L217 1000"/><path d="M500 640 L267 1000"/><path d="M500 640 L301 1000"/><path d="M500 640 L343 1000"/><path d="M500 640 L388 1000"/><path d="M500 640 L434 1000"/><path d="M500 640 L467 1000"/><path d="M500 640 L513 1000"/><path d="M500 640 L555 1000"/><path d="M500 640 L604 1000"/><path d="M500 640 L640 1000"/><path d="M500 640 L688 1000"/><path d="M500 640 L720 1000"/><path d="M500 640 L765 1000"/><path d="M500 640 L811 1000"/><path d="M500 640 L856 1000"/><path d="M500 640 L892 1000"/><path d="M500 640 L931 1000"/><path d="M500 640 L972 1000"/><path d="M500 640 L1019 1000"/><path d="M500 640 L1057 1000"/><path d="M500 640 L1107 1000"/><path d="M500 640 L1150 1000"/><path d="M500 640 L1183 1000"/><path d="M500 640 L1226 1000"/><path d="M500 640 L1275 1000"/><path d="M500 640 L1315 1000"/><path d="M500 640 L1359 1000"/><path d="M500 640 L1395 1000"/><path d="M500 640 L1434 1000"/><path d="M500 640 L1478 1000"/><path d="M500 640 L1527 1000"/><path d="M500 640 L1562 1000"/><path d="M500 640 L1605 1000"/><path d="M500 640 L1648 1000"/><path d="M500 640 L1690 1000"/><path d="M500 640 L1732 1000"/><path d="M500 640 L1781 1000"/></g>
  <g stroke="#140D08" fill="none"><path d="M0 642.0 H1000" stroke-width="0.7" opacity="0.10"/><path d="M0 644.4 H1000" stroke-width="0.9" opacity="0.07"/><path d="M0 647.4 H1000" stroke-width="1.0" opacity="0.20"/><path d="M0 651.0 H1000" stroke-width="1.3" opacity="0.18"/><path d="M0 655.5 H1000" stroke-width="1.6" opacity="0.20"/><path d="M0 660.9 H1000" stroke-width="1.9" opacity="0.13"/><path d="M0 667.5 H1000" stroke-width="2.3" opacity="0.20"/><path d="M0 675.5 H1000" stroke-width="2.8" opacity="0.19"/><path d="M0 685.3 H1000" stroke-width="3.4" opacity="0.10"/><path d="M0 697.3 H1000" stroke-width="4.2" opacity="0.17"/><path d="M0 711.9 H1000" stroke-width="5.1" opacity="0.18"/><path d="M0 729.7 H1000" stroke-width="6.2" opacity="0.16"/><path d="M0 751.5 H1000" stroke-width="7.6" opacity="0.14"/><path d="M0 778.0 H1000" stroke-width="9.3" opacity="0.11"/><path d="M0 810.4 H1000" stroke-width="11.3" opacity="0.12"/><path d="M0 849.9 H1000" stroke-width="13.8" opacity="0.10"/><path d="M0 898.0 H1000" stroke-width="16.9" opacity="0.09"/><path d="M0 956.8 H1000" stroke-width="20.6" opacity="0.15"/></g>
  <rect y="632" width="1000" height="30" fill="#F6A877" opacity=".22" filter="url(#softer)"/>

  <use href="#speaker"/>
  <use href="#speaker" transform="translate(1000 0) scale(-1 1)"/>
  <path d="M150 884 Q240 872 330 896 T500 890 T670 896 T850 872 L860 912 Q500 930 140 912 Z" fill="#3E2E22" opacity=".9"/>
  </g>

  <rect width="1000" height="1000" fill="url(#vignette)"/>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".22" style="mix-blend-mode: overlay"/>
</svg>
