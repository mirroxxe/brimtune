<h2>Brimtune 1.0.6</h2>
<ul>
  <li>With both Safari and Chrome open, Brimtune no longer mixes them up: songs show up within a second or two, and skipping, search and lyrics follow the browser you're listening in</li>
  <li>A song that's paused in one browser no longer steals the island from the one that's playing</li>
</ul>
